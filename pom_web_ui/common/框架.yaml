        - product_sidebar.py        # 产品维护模块左侧菜单（医生管理等）
        - top_module.py             # 顶部模块切换（数字阅片 / 图文报告 / 报告管理 / 产品维护）
        - user_menu.py              # 右上角用户菜单（重设密码 / 退出登录）
    - navigator.py              # 页面跳转总控：对外唯一暴露的“去哪里”
- pages                    # 页面层（Page Object Model）
    - auth                      # 认证相关页面（系统入口）
        - login_page.py
        - reset_password_page.py
    - project                       # 项目/阅片/报告相关页面
        - project_list_page.py          # 项目列表页（支持不同模块模式）
        - project_detail_page.py        # 项目详情页
        - report_editor_page.py         # 报告编辑页
    - product                       # 产品维护相关页面
        - doctor_manage_page.py         # 医生管理页（典型 CRUD 管理页面）
    - panels                        # 页面内部复用组件（不能单独访问）
        - slide_panel.py                # 左侧滑出面板
        - project_info_panel.py         # 项目信息展示面板
    - enums                         # 页面/导航语义枚举（消除魔法字符串）
        - module_mode.py            # 模块模式：数字阅片 / 图文报告 / 报告管理
        - project_tab.py            # 项目 Tab：我的代办 / 全部代办 / 回收站
